name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Add a folder
        2. Start sharing
        3. Open the guest URL
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device and version
    validations:
      required: true
  - type: input
    id: guest
    attributes:
      label: Guest device and browser
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove PINs, cookies, handles, content URIs, and private filenames.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private file metadata.
          required: true
